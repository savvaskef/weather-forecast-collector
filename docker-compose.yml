services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-weather_db}
      POSTGRES_USER: ${DB_USER:-weather_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      TZ: ${TZ:-Europe/Athens}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-weather_user} -d ${DB_NAME:-weather_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8081:80"
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "-S", "0.0.0.0:80", "-t", "/var/www/html/public"]

volumes:
  pgdata: